              - button "More information" [ref=f3e169] [cursor=pointer]: "?"
            - textbox "Promotional Text" [ref=f3e171]: Grow a forest, one glass at a time. Gentle reminders, no guilt — and your water history stays on your phone.
            - status "Characters remaining" [ref=f3e173]: "62"
          - separator [ref=f3e175]
          - generic [ref=f3e176]:
            - generic [ref=f3e178]:
              - generic [ref=f3e179]: Description
              - button "More information" [ref=f3e181] [cursor=pointer]: "?"
            - textbox "Description" [ref=f3e183]: Sipling turns drinking water into something you can see. Every glass waters a sapling. Hit your daily goal and it becomes a tree in your own forest. Miss a day? Nothing dies. Your sapling simply waits for you. A FOREST THAT NEVER WITHERS Most habit apps punish you. Sipling doesn't. There is no guilt, no dying plant, no broken heart icon. A day you missed is just a young sapling, still standing. A GOAL THAT FITS YOU Your daily target is calculated from your weight, sex, age and activity level, based on the European Food Safety Authority's reference values for water from drinks. You can always adjust it yourself. NOT EVERYTHING COUNTS THE SAME Tea, coffee, milk, juice and soda are counted by how much actual water they contain. 250 ml of coffee is not 250 ml of water, and every drink shows the water it really adds. Alcohol counts against you, honestly. REMINDERS THAT ACTUALLY ARRIVE Sipling reminds you between your waking hours, at the interval you choose, and goes quiet once you reach your goal. Tap the reminder to add a glass without even opening the app. HOME SCREEN WIDGET Add a glass straight from your home screen. Your tree grows right there. NO ACCOUNT, NO SIGN-UP Sipling has no account and no sign-up. Your water history is kept on your device, and there is no server that stores your log. You can erase all of it in a single tap. EIGHT TREE SPECIES, TEN ACHIEVEMENTS Oak, pine, sakura, maple, acacia, olive and more. Unlock them by keeping streaks and growing trees, never by paying for the basics. SIPLING PRO Pro removes ads and unlocks seasonal forest themes and a few cosmetic trees. Tracking, goals, statistics, reminders and your forest are free, forever. We will never put a paywall in front of the things that matter. - Celebrations are always ad-free. - No account and no sign-up. - Your water history stays on your device. Drink water. Grow a forest. Be kind to yourself.
            - status "Characters remaining" [ref=f3e185]: "2.084"
