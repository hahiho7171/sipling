            - textbox "Notes" [ref=f3e347]: "Sipling is a water-tracking app. It works fully without any account or sign-in - all features are available immediately on first launch, so no demo account is needed. The free version shows non-personalized ads (Google AdMob); the app does not track users and does not use the IDFA. \"Sipling Pro\" is an auto-renewable monthly subscription (product ID: sipling_pro_monthly) that removes ads and unlocks cosmetic seasonal forest themes. The paywall is reachable from the Settings tab > the \"Sipling Pro\" banner at the top, and includes a Restore Purchases button, Terms of Use and Privacy Policy links, and an auto-renewal disclosure. All user data is stored locally on the device; there is no server. HealthKit is not used on iOS. Thank you for reviewing."
